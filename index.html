<!DOCTYPE html>
<html>

<head>
    <title>Student Task Manager</title>
    <div class="student-profile">
    <h2>Student Profile</h2>
    <p><strong>Name:</strong> Ajay</p>
    <p><strong>Course:</strong> Computer Engineering</p>
    <p><strong>Semester:</strong> 3</p>
</div>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Task Manager</h1>

        <!-- Dashboard from main -->
        <div class="dashboard">

            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <h4>completed your work</h4>
                <p id="completedTasks">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

        </div>

        <!-- Task input with priority from feature/task-priority -->
        <input type="text" id="taskInput" placeholder="Enter a task">

        <select id="priorityInput">
            <option value="Low">Low Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="High">High Priority</option>
        </select>

        <button onclick="addTask()">Add Task</button>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
